<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DG Gel · Pantalla</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #escena { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; }

  /* Máscara virtual (foto de la tarjeta): se apaga desde el moderador o con la tecla M cuando está puesta la máscara física */
  #mascara { transition: opacity .4s; }
  body.sin-mascara #mascara { opacity: 0; }

  .gota { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0;
          transition: transform .45s cubic-bezier(.2,.9,.3,1.3), opacity .3s; }
  .gota.on { transform: scale(1); opacity: 1; }
  .gota.off { transform: scale(.2); opacity: 0; transition: transform .35s ease-in, opacity .3s; }

  .estela { opacity: 0; transition: transform 1.4s cubic-bezier(.5,0,.6,1), opacity .3s; }
  .estela.on { opacity: .9; }
  .estela.pos { transition-duration: .9s; }

  .resultado { opacity: 0; transition: opacity .6s; }
  .resultado.on { opacity: 1; }

  @keyframes centrifuga {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(1.2px,-0.8px); } 20% { transform: translate(-1.1px,0.9px); }
    30% { transform: translate(1px,1px); }      40% { transform: translate(-1.2px,-0.6px); }
    50% { transform: translate(0.9px,-1.1px); } 60% { transform: translate(-0.8px,1.1px); }
    70% { transform: translate(1.1px,0.7px); }  80% { transform: translate(-1px,-1px); }
    90% { transform: translate(0.7px,0.9px); }
  }
  #tarjeta.vibra { animation: centrifuga .12s linear infinite; }

  #firma path { fill: none; stroke: #16246b; stroke-linecap: round; stroke-linejoin: round; }
  #firma path.lleno { fill: #16246b; stroke-width: 0 !important; transition: fill .3s; }
  #firma text { font-family: 'Shadows Into Light', cursive; fill: #16246b; }

  #hud { position: absolute; left: 12px; bottom: 10px; font: 12px/1.4 system-ui, sans-serif; color: #7a7a7a; opacity: 0; transition: opacity .3s; }
  body.hud #hud { opacity: 1; }
</style>
</head>
<body>
<div id="escena">
<svg id="svg" viewBox="0 0 1448 1086" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="gRojo" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff5a5a"/><stop offset=".6" stop-color="#d0121f"/><stop offset="1" stop-color="#8e0713"/>
    </radialGradient>
    <filter id="desenfoque"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="1448" height="1086" fill="#000"/>
  <g id="tarjeta">
    <!-- 1. Lo que asoma por las ventanas: gel con sangrado y ventana blanca del nombre -->
    <image id="liquidos" href="../assets/foto/liquidos.png" x="0" y="0" width="1448" height="1086"/>
    <!-- 2. Sedimentos animados (por columna) -->
    <g id="tubos"></g>
    <!-- 3. Nombre manuscrito -->
    <g id="franja"></g>
    <!-- 4. Máscara virtual: la foto de la tarjeta con los huecos transparentes -->
    <image id="mascara" href="../assets/foto/mascara.png" x="0" y="0" width="1448" height="1086"/>
  </g>
</svg>
</div>
<div id="hud"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../assets/opentype.min.js"></script>
<script src="../assets/tipos.js"></script>
<script src="../assets/firebase-config.js"></script>
<script src="../assets/bus.js"></script>
<script>
(function () {
  const { PATRONES, NOMBRES, GRUPOS } = DGGEL;
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  const espera = ms => new Promise(r => setTimeout(r, ms));
  const params = new URLSearchParams(location.search);

  // ---------- Geometría (px de la foto de referencia, 1448 × 1086) ----------
  const CX = [140, 307, 475, 642, 802, 974, 1141, 1307];
  const GEL_TOP = [275, 268, 262, 262, 262, 262, 262, 262];
  const Y_COPA = 120, Y_LINEA = 350, Y_BOTON = 512, Y_CUELLO = 243, Y_MID = 290;
  const F = { x: 300, y: 745, w: 1030, h: 130 }; // ventana del nombre
  const SPR = {
    boton:        { src: '../assets/foto/boton.png',        w: 80, h: 44, ax: 40, ay: 40 },
    linea_fina:   { src: '../assets/foto/linea_fina.png',   w: 88, h: 28, ax: 44, ay: 10 },
    linea_gruesa: { src: '../assets/foto/linea_gruesa.png', w: 88, h: 48, ax: 44, ay: 12 },
    arrastre:     { src: '../assets/foto/arrastre.png',     w: 96, h: 38, ax: 48, ay: 19 },
  };
  function sprite(nombre, cx, y, attrs, parent) {
    const p = SPR[nombre];
    return el('image', Object.assign({ href: p.src, x: cx - p.ax, y: y - p.ay, width: p.w, height: p.h }, attrs), parent);
  }

  const tubos = [];
  CX.forEach((cx, i) => {
    // Todo lo de la columna se estira 1.5× en X y 1.06× en Y, igual que la capa de líquidos (sangrado bajo la máscara)
    const g = el('g', { class: 'tubo', transform: `translate(${cx},${Y_MID}) scale(1.5,1.06) translate(${-cx},${-Y_MID})` }, $('tubos'));
    const gota = el('circle', { class: 'gota', cx, cy: Y_COPA, r: 19, fill: 'url(#gRojo)' }, g);
    const estela = sprite('boton', cx, Y_CUELLO + 30, { class: 'estela', filter: 'url(#desenfoque)', transform: '' }, g);
    // resultados posibles (se enciende uno)
    const linea = sprite(i % 2 ? 'linea_gruesa' : 'linea_fina', cx, Y_LINEA, { class: 'resultado linea' }, g);
    const arrastre = sprite('arrastre', cx, Y_CUELLO, { class: 'resultado arrastre' }, g);
    const boton = sprite('boton', cx, Y_BOTON, { class: 'resultado boton' }, g);
    tubos.push({ cx, gota, estela, linea, arrastre, boton });
  });

  const firma = el('g', { id: 'firma' }, $('franja'));

  // ---------- Escritura a mano (opentype.js) ----------
  let fuente = null;
  opentype.load('../assets/fonts/ShadowsIntoLight.ttf', (err, f) => { if (!err) fuente = f; else console.warn('fuente', err); });

  function limpiarFirma() { while (firma.firstChild) firma.removeChild(firma.firstChild); }

  // Ancho real (caja de los trazos, no el avance) de un texto a cierto tamaño
  function anchoReal(texto, size) {
    const bb = fuente.getPath(texto, 0, 0, size).getBoundingBox();
    return { w: bb.x2, x1: bb.x1 };
  }

  // Escribe texto trazo por trazo. Devuelve promesa que resuelve con la x donde termina el trazo.
  async function escribir(texto, x, y, size, maxW, velocidad = 1) {
    if (!fuente) { // respaldo sin opentype: texto plano con la fuente vía CSS
      const t = el('text', { x, y, 'font-size': size }, firma); t.textContent = texto; return x + maxW;
    }
    let ancho = anchoReal(texto, size).w;
    if (ancho > maxW) { size = size * maxW / ancho; ancho = anchoReal(texto, size).w; }
    const paths = fuente.getPaths(texto, x, y, size);
    const grosor = Math.max(3, size * 0.05);
    const trazos = [];
    for (const p of paths) {
      const d = p.toPathData(2);
      if (!d) continue;
      const n = el('path', { d, 'stroke-width': grosor }, firma);
      const L = n.getTotalLength();
      n.style.strokeDasharray = L + ' ' + L;
      n.style.strokeDashoffset = L;
      trazos.push({ n, L });
    }
    for (const { n, L } of trazos) {
      const dur = Math.min(900, Math.max(120, L / (1.6 * velocidad))); // ms
      n.style.transition = `stroke-dashoffset ${dur}ms linear`;
      // forzar reflow
      n.getBoundingClientRect();
      n.style.strokeDashoffset = 0;
      await espera(dur * 0.85);
      n.classList.add('lleno');
    }
    return x + ancho;
  }

  // Subrayado "a mano": trazo ligeramente irregular que se dibuja de izquierda a derecha
  async function subrayar(x1, x2, y) {
    const pasos = 6, dx = (x2 - x1) / pasos;
    let d = `M${x1},${y + 2}`;
    for (let i = 1; i <= pasos; i++) {
      const cx = x1 + dx * (i - 0.5), cy = y + (i % 2 ? -2.5 : 2.5) + (Math.random() - 0.5) * 2;
      d += ` Q${cx.toFixed(1)},${cy.toFixed(1)} ${(x1 + dx * i).toFixed(1)},${(y + (i === pasos ? -1 : 1) * 1.5).toFixed(1)}`;
    }
    const n = el('path', { d, 'stroke-width': 3.5, class: 'subrayado' }, firma);
    const L = n.getTotalLength();
    n.style.strokeDasharray = L + ' ' + L;
    n.style.strokeDashoffset = L;
    n.style.transition = 'stroke-dashoffset 380ms ease-out';
    n.getBoundingClientRect();
    n.style.strokeDashoffset = 0;
    await espera(400);
  }

  // ---------- Animación de un registro ----------
  function reset() {
    $('tarjeta').classList.remove('vibra');
    tubos.forEach(t => {
      t.gota.classList.remove('on', 'off');
      t.estela.classList.remove('on', 'pos');
      t.estela.style.transform = '';
      t.linea.classList.remove('on'); t.arrastre.classList.remove('on'); t.boton.classList.remove('on');
    });
    limpiarFirma();
  }

  async function reproducir(reg) {
    const patron = PATRONES[reg.grupo] || PATRONES['O+'];
    reset();
    await espera(300);
    // 1. muestra en cada pocillo
    tubos.forEach((t, i) => setTimeout(() => t.gota.classList.add('on'), i * 90));
    await espera(1300);
    // 2. centrifugado: los glóbulos bajan
    $('tarjeta').classList.add('vibra');
    await espera(500);
    tubos.forEach((t, i) => setTimeout(() => {
      t.gota.classList.add('off');
      const pos = patron[i];
      const destino = (pos ? Y_LINEA : Y_BOTON - 6) - (Y_CUELLO + 30);
      t.estela.classList.add('on'); if (pos) t.estela.classList.add('pos');
      t.estela.getBoundingClientRect();
      t.estela.style.transform = `translateY(${destino}px)`;
    }, 200 + i * 70));
    await espera(2100);
    tubos.forEach((t, i) => setTimeout(() => {
      if (patron[i]) { t.linea.classList.add('on'); if (i % 3 === 0 || i > 5) t.arrastre.classList.add('on'); }
      else t.boton.classList.add('on');
      t.estela.classList.remove('on');
    }, i * 50));
    await espera(700);
    $('tarjeta').classList.remove('vibra');
    // 3. nombre manuscrito y grupo (alineado a la derecha, subrayado)
    await espera(300);
    const grupoTxt = NOMBRES[reg.grupo] || reg.grupo;
    const GAP = 40, margen = 28, sizeGrupo = 46, sizeNombre = 82, base = F.y + 98;
    const anchoGrupo = fuente ? anchoReal(grupoTxt, sizeGrupo).w : 300;
    const maxNombre = F.w - 2 * margen - GAP - anchoGrupo;
    await escribir(reg.nombre, F.x + margen, base, sizeNombre, maxNombre, 1);
    await espera(250);
    const xGrupo = F.x + F.w - margen - anchoGrupo;
    await escribir(grupoTxt, xGrupo, base, sizeGrupo, anchoGrupo + 8, 1.4);
    await espera(120);
    await subrayar(xGrupo - 4, xGrupo + anchoGrupo + 8, base + 18);
  }

  async function idle() {
    reset();
    await espera(200);
    tubos.forEach((t, i) => setTimeout(() => t.gota.classList.add('on'), i * 120));
    await espera(900);
    await escribir('Escanea el código y escribe tu historia', F.x + 28, F.y + 96, 60, F.w - 56, 1.3);
  }

  // ---------- Cola y control ----------
  const cola = [];
  let ocupado = false, pausa = false, reposo = 10, enIdle = false, ultimoReproducir = null;

  function publicar(mostrando) {
    BUS.setEstado({ enCola: cola.length, mostrando: mostrando ? { nombre: mostrando.nombre, grupo: mostrando.grupo } : null }).catch(() => {});
    $('hud').textContent = `${BUS.DEMO ? 'DEMO · ' : ''}cola: ${cola.length} · reposo: ${reposo}s${pausa ? ' · PAUSA' : ''}`;
  }

  async function bucle() {
    if (ocupado) return;
    ocupado = true;
    do {
      while (cola.length && !pausa) {
        const reg = cola.shift();
        enIdle = false;
        publicar(reg);
        await reproducir(reg);
        await espera(reposo * 1000);
      }
      publicar(null);
      if (!enIdle) { enIdle = true; await idle(); }
    } while (cola.length && !pausa); // llegó algo mientras se escribía el modo espera
    ocupado = false;
  }

  function encolar(reg, alFrente) {
    if (!reg || !reg.nombre) return;
    reg.nombre = String(reg.nombre).trim().slice(0, 28);
    if (!PATRONES[reg.grupo]) reg.grupo = 'O+';
    alFrente ? cola.unshift(reg) : cola.push(reg);
    publicar(null);
    bucle();
  }

  BUS.onRegistro(r => encolar(r));
  BUS.onControl(c => {
    if (!c) return;
    if (typeof c.reposo === 'number') reposo = Math.max(3, Math.min(60, c.reposo));
    const p = !!c.pausa; if (p !== pausa) { pausa = p; if (!pausa) bucle(); }
    if (c.reproducir && c.reproducir.id && c.reproducir.id !== ultimoReproducir) {
      ultimoReproducir = c.reproducir.id;
      encolar({ nombre: c.reproducir.nombre, grupo: c.reproducir.grupo }, true);
    }
    if (typeof c.mascara === 'boolean') document.body.classList.toggle('sin-mascara', !c.mascara);
    if (c.borrado) { cola.length = 0; publicar(null); }
    publicar(null);
  });

  // ---------- Teclas de prueba ----------
  const nombresDemo = ['Roberto Carpinteyro', 'Leticia Contreras', 'Diego Rivera', 'Ana Sofía Martínez', 'Jorge Luis', 'María Fernanda', 'Armando', 'Arturo'];
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '8') { const i = +k - 1; encolar({ nombre: nombresDemo[i], grupo: GRUPOS[i] }); }
    if (k === 'm') document.body.classList.toggle('sin-mascara');
    if (k === 'h') document.body.classList.toggle('hud');
    if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    if (k === ' ') { pausa = !pausa; if (!pausa) bucle(); publicar(null); }
  });

  if (params.get('mascara') === '0') document.body.classList.add('sin-mascara');
  if (params.get('hud') === '1') document.body.classList.add('hud');

  // Arranque
  window.addEventListener('load', async () => {
    await espera(600); // deja cargar la fuente
    if (params.get('nombre')) encolar({ nombre: params.get('nombre'), grupo: params.get('grupo') || 'O+' });
    else bucle();
  });
})();
</script>
</body>
</html>
